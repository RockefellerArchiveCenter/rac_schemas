name: Test

on:
  pull_request:
    branches:
      - development

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.0

      - name: Set up Python
        uses: actions/setup-python@v6.1.0
        with:
          python-version: 3.11
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install tox
        run: pip install --upgrade tox

      - name: Run tox
        run: tox

